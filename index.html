<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Performance Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            padding: 40px 20px;
            color: #1e293b;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 36px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .header p {
            color: #64748b;
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(15, 23, 42, 0.10);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .field input,
        .field select {
            padding: 12px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        .field input:focus,
        .field select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .button-container {
            margin-top: 28px;
            text-align: center;
        }

        button {
            border: none;
            background: #2563eb;
            color: white;
            padding: 14px 35px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 15px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
        }

        .result h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1e293b;
        }

        .prediction {
            text-align: center;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .result-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .result-box .label {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 7px;
        }

        .result-box .value {
            font-size: 19px;
            font-weight: 700;
            color: #1e293b;
        }

        .factors {
            margin-top: 20px;
        }

        .factors h3 {
            margin-bottom: 10px;
        }

        .factors p {
            margin: 6px 0;
            color: #475569;
        }

        .error {
            display: none;
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            display: none;
            margin-top: 15px;
            text-align: center;
            color: #475569;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Student Performance Prediction</h1>
            <p>Predict student academic performance using Machine Learning</p>
        </div>

        <div class="card">

            <div class="form-grid">

                <div class="field">
                    <label for="attendance">Attendance (%)</label>
                    <input type="number" id="attendance" value="85" min="0" max="100">
                </div>

                <div class="field">
                    <label for="study_hours">Study Hours Per Day</label>
                    <input type="number" id="study_hours" value="6.5" min="0" step="0.1">
                </div>

                <div class="field">
                    <label for="previous_marks">Previous Marks</label>
                    <input type="number" id="previous_marks" value="75" min="0" max="100">
                </div>

                <div class="field">
                    <label for="assignments">Assignments Completed</label>
                    <input type="number" id="assignments" value="18" min="0">
                </div>

                <div class="field">
                    <label for="sleep_hours">Sleep Hours</label>
                    <input type="number" id="sleep_hours" value="7.5" min="0" step="0.1">
                </div>

                <div class="field">
                    <label for="internet_access">Internet Access</label>
                    <select id="internet_access">
                        <option value="Yes">Yes</option>
                        <option value="No">No</option>
                    </select>
                </div>

                <div class="field">
                    <label for="extra_classes">Extra Classes</label>
                    <select id="extra_classes">
                        <option value="No">No</option>
                        <option value="Yes">Yes</option>
                    </select>
                </div>

                <div class="field">
                    <label for="model_type">Machine Learning Model</label>
                    <select id="model_type">
                        <option value="random_forest">Random Forest</option>
                        <option value="decision_tree">Decision Tree</option>
                        <option value="logistic_regression">Logistic Regression</option>
                        <option value="knn">KNN</option>
                    </select>
                </div>

            </div>

            <div class="button-container">
                <button id="predictButton" onclick="predictPerformance()">
                    Predict Performance
                </button>
            </div>

            <div class="loading" id="loading">
                Making prediction...
            </div>

            <div class="error" id="error"></div>

            <div class="result" id="result">

                <h2>Prediction Result</h2>

                <div class="prediction" id="prediction"></div>

                <div class="result-grid">

                    <div class="result-box">
                        <div class="label">Pass Probability</div>
                        <div class="value" id="passProbability">-</div>
                    </div>

                    <div class="result-box">
                        <div class="label">Fail Probability</div>
                        <div class="value" id="failProbability">-</div>
                    </div>

                    <div class="result-box">
                        <div class="label">Risk Level</div>
                        <div class="value" id="riskTier">-</div>
                    </div>

                </div>

                <div class="factors">
                    <h3>Key Factors</h3>

                    <p>
                        <strong>Study Hours:</strong>
                        <span id="studyContribution">-</span>
                    </p>

                    <p>
                        <strong>Attendance:</strong>
                        <span id="attendanceFactor">-</span>
                    </p>

                    <p>
                        <strong>Previous Marks:</strong>
                        <span id="marksFactor">-</span>
                    </p>

                    <p>
                        <strong>Assignments:</strong>
                        <span id="assignmentsFactor">-</span>
                    </p>
                </div>

            </div>

        </div>

    </div>

    <script>

        async function predictPerformance() {

            const button = document.getElementById("predictButton");
            const loading = document.getElementById("loading");
            const result = document.getElementById("result");
            const error = document.getElementById("error");

            result.style.display = "none";
            error.style.display = "none";

            button.disabled = true;
            loading.style.display = "block";

            const data = {
                attendance: Number(document.getElementById("attendance").value),
                study_hours: Number(document.getElementById("study_hours").value),
                previous_marks: Number(document.getElementById("previous_marks").value),
                assignments: Number(document.getElementById("assignments").value),
                sleep_hours: Number(document.getElementById("sleep_hours").value),
                internet_access: document.getElementById("internet_access").value,
                extra_classes: document.getElementById("extra_classes").value,
                model_type: document.getElementById("model_type").value
            };

            try {

                const response = await fetch("/api/index", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const resultData = await response.json();

                if (!response.ok) {
                    throw new Error(resultData.error || "Prediction failed.");
                }

                document.getElementById("prediction").textContent =
                    resultData.prediction;

                document.getElementById("passProbability").textContent =
                    resultData.pass_probability + "%";

                document.getElementById("failProbability").textContent =
                    resultData.fail_probability + "%";

                document.getElementById("riskTier").textContent =
                    resultData.risk_tier;

                const factors = resultData.key_factors || {};

                document.getElementById("studyContribution").textContent =
                    factors["Study Hours Contribution"] || "-";

                document.getElementById("attendanceFactor").textContent =
                    factors["Attendance"] || "-";

                document.getElementById("marksFactor").textContent =
                    factors["Previous Marks"] || "-";

                document.getElementById("assignmentsFactor").textContent =
                    factors["Assignments Completed"] || "-";

                result.style.display = "block";

            } catch (err) {

                error.textContent = "Error: " + err.message;
                error.style.display = "block";

            } finally {

                button.disabled = false;
                loading.style.display = "none";
            }
        }

    </script>

</body>

</html>
